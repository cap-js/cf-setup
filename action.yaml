name: CAP setup for Cloud Foundry
description: Installs dependencies for Cloud Foundry deployment
branding:
  icon: terminal
  color: blue

inputs:
  version:
    description: The version of the Cloud Foundry CLI to install
    required: false
    default: "8.17.0"
  api:
    description: The Cloud Foundry API endpoint to connect to
    required: true
  org:
    description: The Cloud Foundry organization to target
    required: true
  space:
    description: The Cloud Foundry space to target
    required: true
  username:
    description: The Cloud Foundry username to authenticate with
    required: true
  password:
    description: The Cloud Foundry password to authenticate with
    required: true
  origin:
    description: Optional UAA origin (identity provider) to use for authentication
    required: false

runs:
  using: composite
  steps:
    - name: Install CF CLI
      shell: bash
      run: |
        set -euo pipefail

        echo "Using CF_VERSION=${{ inputs.version }}"
        echo "Using CF_API=${{ inputs.api }}"

        curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=${{ inputs.version }}&source=github" \
          -o cf-cli.tgz

        mkdir -p cf-cli
        tar -xzf cf-cli.tgz -C cf-cli
        chmod +x cf-cli/cf

        echo "${PWD}/cf-cli" >> "$GITHUB_PATH"

    - name: Install MBT
      shell: bash
      run: npm install -g mbt

    - name: Install CF CLI multiapps plugin
      shell: bash
      run: cf install-plugin multiapps -f

    - name: Authenticate to Cloud Foundry
      shell: bash
      run: |
        cf api "${{ inputs.api }}"
        export CF_PASSWORD='${{ inputs.password }}'
        ORIGIN='${{ inputs.origin }}'

        if [ -n "$ORIGIN" ]; then
          cf auth "${{ inputs.username }}" --origin "$ORIGIN"
        else
          cf auth "${{ inputs.username }}"
        fi

        cf target -o "${{ inputs.org }}" -s "${{ inputs.space }}"
