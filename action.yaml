name: CAP setup for Cloud Foundry
description: Installs dependencies for Cloud Foundry deployment
branding:
  icon: terminal
  color: blue

inputs:
  cli-version:
    description: The version of the Cloud Foundry CLI to install
    required: false
    default: "8.18.4"
  version:
    description: (Deprecated) Alias for `cli-version`. Prefer `cli-version`.
    required: false
    default: ""
  mbt-version:
    description: The version of MBT (Multitarget Build Tool) to install, e.g. "1.2.49". Defaults to "latest".
    required: false
    default: "latest"
  api:
    description: The Cloud Foundry API endpoint to connect to
    required: true
  org:
    description: The Cloud Foundry organization to target
    required: true
  space:
    description: The Cloud Foundry space to target
    required: true
  username:
    description: The Cloud Foundry username to authenticate with
    required: true
  password:
    description: The Cloud Foundry password to authenticate with
    required: true
  origin:
    description: Optional UAA origin (identity provider) to use for authentication
    required: false

runs:
  using: composite
  steps:
    - name: Install CF CLI
      shell: bash
      run: |
        set -euo pipefail

        # `version` is a deprecated alias for `cli-version`; if the caller set
        # it explicitly, honor that, otherwise use `cli-version`.
        CF_VERSION='${{ inputs.version }}'
        if [ -z "$CF_VERSION" ]; then
          CF_VERSION='${{ inputs.cli-version }}'
        else
          echo "::warning::input 'version' is deprecated; use 'cli-version' instead"
        fi

        echo "Using CF_VERSION=$CF_VERSION"
        echo "Using CF_API=${{ inputs.api }}"

        curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=${CF_VERSION}&source=github" \
          -o cf-cli.tgz

        mkdir -p cf-cli
        tar -xzf cf-cli.tgz -C cf-cli
        chmod +x cf-cli/cf

        echo "${PWD}/cf-cli" >> "$GITHUB_PATH"

    - name: Install MBT
      shell: bash
      run: |
        echo "Using MBT_VERSION=${{ inputs.mbt-version }}"
        # npm 12 default-denies dependency install scripts; mbt needs them, so
        # allow-list it (and its known script-running deps) for this install.
        # Harmless on npm <12, which ignores the config.
        npm install -g \
          --allow-scripts=mbt \
          "mbt@${{ inputs.mbt-version }}"

    - name: Install CF CLI multiapps plugin
      shell: bash
      run: cf install-plugin multiapps -f

    - name: Authenticate to Cloud Foundry
      shell: bash
      run: |
        cf api "${{ inputs.api }}"
        export CF_PASSWORD='${{ inputs.password }}'
        ORIGIN='${{ inputs.origin }}'

        if [ -n "$ORIGIN" ]; then
          cf auth "${{ inputs.username }}" --origin "$ORIGIN"
        else
          cf auth "${{ inputs.username }}"
        fi

        cf target -o "${{ inputs.org }}" -s "${{ inputs.space }}"
