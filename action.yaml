name: CAP setup for Cloud Foundry
description: Installs dependencies for Cloud Foundry deployment
branding:
  icon: terminal
  color: blue

inputs:
  cli-version:
    description: The version of the Cloud Foundry CLI to install
    required: false
    default: "8.18.4"
  cli-sha256:
    description: >-
      Optional SHA-256 of the Linux x86-64 CF CLI archive (`cf8-cli_<version>_linux_x86-64.tgz`).
      If empty, the digest published on the cloudfoundry/cli GitHub release is used.
    required: false
    default: ""
  version:
    description: (Deprecated) Alias for `cli-version`. Prefer `cli-version`.
    required: false
    default: ""
  mbt-version:
    description: The version of MBT (Multitarget Build Tool) to install, e.g. "1.2.49". Defaults to "latest".
    required: false
    default: "latest"
  api:
    description: The Cloud Foundry API endpoint to connect to
    required: true
  org:
    description: The Cloud Foundry organization to target
    required: true
  space:
    description: The Cloud Foundry space to target
    required: true
  username:
    description: The Cloud Foundry username to authenticate with. Required unless `oidc-audience` is set.
    required: false
  password:
    description: The Cloud Foundry password to authenticate with. Required unless `oidc-audience` is set.
    required: false
  origin:
    description: UAA origin (identity provider) to use for authentication. Required when `oidc-audience` is set.
    required: false
  oidc-audience:
    description: >-
      Opt-in GitHub OIDC login. Set to the audience (issuer URI) expected by the identity provider
      to authenticate with a GitHub OIDC token instead of username and password.
      The calling job needs `permissions: id-token: write`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install CF CLI
      shell: bash
      run: |
        set -euo pipefail

        # `version` is a deprecated alias for `cli-version`; if the caller set
        # it explicitly, honor that, otherwise use `cli-version`.
        CF_VERSION='${{ inputs.version }}'
        if [ -z "$CF_VERSION" ]; then
          CF_VERSION='${{ inputs.cli-version }}'
        else
          echo "::warning::input 'version' is deprecated; use 'cli-version' instead"
        fi

        echo "Using CF_VERSION=$CF_VERSION"
        echo "Using CF_API=${{ inputs.api }}"

        curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=${CF_VERSION}&source=github" \
          -o cf-cli.tgz

        # Verify the archive before extracting it. Use the pinned checksum if given,
        # otherwise the SHA-256 digest GitHub publishes for the release asset.
        EXPECTED_SHA256='${{ inputs.cli-sha256 }}'
        if [ -z "$EXPECTED_SHA256" ]; then
          EXPECTED_SHA256=$(curl -fsSL \
            -H "${{ github.server_url == 'https://github.com' && format('Authorization: Bearer {0}', github.token) || '' }}" \
            "https://api.github.com/repos/cloudfoundry/cli/releases/tags/v${CF_VERSION}" \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).assets.find(a => a.name === process.argv[1])?.digest?.replace(/^sha256:/, "") || ""' \
              "cf8-cli_${CF_VERSION}_linux_x86-64.tgz")
        fi
        if [ -z "$EXPECTED_SHA256" ]; then
          echo "::error::Could not determine the expected SHA-256 for CF CLI ${CF_VERSION}. Set the 'cli-sha256' input."
          exit 1
        fi
        echo "${EXPECTED_SHA256}  cf-cli.tgz" | sha256sum -c - \
          || { echo "::error::SHA-256 mismatch for the downloaded CF CLI archive."; exit 1; }

        mkdir -p cf-cli
        tar -xzf cf-cli.tgz -C cf-cli
        chmod +x cf-cli/cf

        echo "${PWD}/cf-cli" >> "$GITHUB_PATH"

    - name: Install MBT
      shell: bash
      run: |
        echo "Using MBT_VERSION=${{ inputs.mbt-version }}"
        # npm 12 default-denies dependency install scripts; mbt needs them, so
        # allow-list it (and its known script-running deps) for this install.
        # Harmless on npm <12, which ignores the config.
        npm install -g \
          --allow-scripts=mbt \
          "mbt@${{ inputs.mbt-version }}"

    - name: Install CF CLI multiapps plugin
      shell: bash
      run: cf install-plugin multiapps -f

    - name: Authenticate to Cloud Foundry
      if: inputs.oidc-audience == ''
      shell: bash
      run: |
        if [ -z '${{ inputs.username }}' ] || [ -z '${{ inputs.password }}' ]; then
          echo "::error::Set 'username' and 'password', or 'oidc-audience' for OIDC login."
          exit 1
        fi

        cf api "${{ inputs.api }}"
        export CF_PASSWORD='${{ inputs.password }}'
        ORIGIN='${{ inputs.origin }}'

        if [ -n "$ORIGIN" ]; then
          cf auth "${{ inputs.username }}" --origin "$ORIGIN"
        else
          cf auth "${{ inputs.username }}"
        fi

        cf target -o "${{ inputs.org }}" -s "${{ inputs.space }}"

    - name: Authenticate to Cloud Foundry (GitHub OIDC)
      if: inputs.oidc-audience != ''
      shell: bash
      env:
        CF_API: ${{ inputs.api }}
        CF_ORG: ${{ inputs.org }}
        CF_SPACE: ${{ inputs.space }}
        CF_ORIGIN: ${{ inputs.origin }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
      run: |
        set -euo pipefail

        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set. The calling job needs 'permissions: id-token: write'."
          exit 1
        fi
        if [ -z "$CF_ORIGIN" ]; then
          echo "::error::Input 'origin' is required when 'oidc-audience' is set."
          exit 1
        fi

        # A trailing slash is a common mistake and would make the audience not match
        audience=$(node -p 'encodeURIComponent(process.env.OIDC_AUDIENCE.replace(/\/$/, ""))')
        if ! jwt=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).value || ""'); then
          jwt=""
        fi
        if [ -z "$jwt" ]; then
          echo "::error::Could not get a GitHub OIDC token."
          exit 1
        fi
        echo "::add-mask::$jwt"

        for i in {1..5}; do
          if cf api "$CF_API" \
              && cf auth --assertion "$jwt" --origin "$CF_ORIGIN" \
              && cf target -o "$CF_ORG" -s "$CF_SPACE"; then
            exit 0
          fi
          echo "cf login failed, retrying ($i/5)..."
          sleep 10
        done
        echo "::error::cf login failed after 5 attempts."
        exit 1
